<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#14574e">
<meta name="description" content="小学校高学年から中学生へ。対比・反対語・接続語・根拠・記述をスクロール不要で学ぶ読解アプリ。">
<title>読解ラボ｜スクロールなしで学ぼう</title>
<style>
:root{--ink:#183b3b;--muted:#66817e;--forest:#12685a;--forest-dark:#104e47;--paper:#ffffff;--border:#dce9e5;--cream:#fff6e9;--bg:#eff6f2;--gold:#f3c36a;--mint:#e2f4ee;--error:#9c414f;--error-bg:#ffeff1;--radius:19px}
*{box-sizing:border-box}
html,body{height:100%;width:100%;margin:0;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;background:linear-gradient(125deg,#e5f3ec,#f5f9f7);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:16px;line-height:1.55}
button,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.53;cursor:default}
button:focus-visible,textarea:focus-visible{outline:3px solid #e4b152;outline-offset:3px}
.shell{width:min(100%,790px);height:100vh;height:100dvh;margin:0 auto;padding:clamp(7px,1.6vh,15px) clamp(9px,2.5vw,18px) max(8px,env(safe-area-inset-bottom));display:flex;flex-direction:column;min-height:0;gap:8px}
.topbar{flex:0 0 auto;height:45px;display:flex;justify-content:space-between;align-items:center;gap:9px;padding:0 2px}
.brand{display:flex;align-items:center;gap:9px;padding:0;border:0;background:transparent;color:var(--ink);font-weight:900;font-size:clamp(18px,4vw,22px);letter-spacing:.02em;white-space:nowrap}
.brand-mark{display:grid;place-items:center;border-radius:11px;background:var(--forest);color:white;width:34px;height:34px;font-size:18px}
.topstats{display:flex;gap:6px;white-space:nowrap;font-size:12px;font-weight:800;color:var(--forest)}.topstats span{border:1px solid var(--border);border-radius:50px;background:#fff;padding:5px 9px}
#app{flex:1;min-height:0;min-width:0;display:flex}
.screen{height:100%;width:100%;display:flex;flex-direction:column;gap:8px;min-height:0}
.screenhead{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:30px}
.screenhead h1{font-size:clamp(16px,3.8vw,21px);font-weight:900;line-height:1.3;margin:0}.meta{font-size:12px;color:var(--muted)}
.linkbtn{border:0;background:transparent;color:var(--forest);font-size:13px;font-weight:800;padding:7px 4px;white-space:nowrap}
.panel{flex:1;min-height:0;min-width:0;overflow:hidden;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--border);border-radius:var(--radius);padding:clamp(13px,2.2vh,22px);box-shadow:0 7px 24px #1b5d5420}
.panel-inner{min-height:0;flex:1;display:flex;flex-direction:column;gap:12px}
.panel-bottom{flex:0 0 auto;display:flex;gap:9px;align-items:center;justify-content:space-between;margin-top:10px}
.btn{border:0;border-radius:12px;display:inline-flex;justify-content:center;align-items:center;text-align:center;min-height:45px;padding:9px 15px;font-size:14px;line-height:1.25;font-weight:900;white-space:nowrap;flex-shrink:0}
.btn.primary{background:var(--forest);color:#fff}.btn.gold{background:var(--gold);color:#473920}.btn.outline{color:var(--forest);background:#fff;border:1.5px solid #accfc5}.btn.full{width:100%;flex:0 0 auto}.btn.flex{flex:1}.btn.small{min-height:36px;padding:7px 12px;font-size:13px}
.flexgrow{flex:1;min-height:0}.center{justify-content:center;align-items:center;text-align:center}
.eyebrow{font-weight:800;color:var(--forest);font-size:12px;letter-spacing:.12em}
.home-intro{display:flex;flex-direction:column;gap:2px}.home-intro h1{font-size:clamp(20px,5vw,31px);margin:0;line-height:1.35;letter-spacing:.01em}.home-intro p{font-size:clamp(12px,2.8vw,15px);color:var(--muted);margin:2px 0 0}
.groupname{font-size:13px;font-weight:900;color:var(--ink);margin:0 0 7px}
.levelgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.levelbtn{border:1.5px solid var(--border);background:#fff;border-radius:12px;padding:8px 5px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:900;font-size:14px;color:var(--ink);line-height:1.25}
.levelbtn small{font-size:10px;color:var(--muted);font-weight:500;white-space:nowrap}
.levelbtn[aria-pressed="true"]{border-color:var(--forest);background:var(--mint)}
.home-menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:8px;flex:1;min-height:0}
.menu-btn{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:9px 11px;display:flex;flex-direction:column;justify-content:center;gap:2px;text-align:left;min-height:0;min-width:0;color:var(--ink)}
.menu-btn:hover{border-color:var(--forest)}.menu-btn b{font-size:clamp(13px,3.2vw,17px);line-height:1.28}.menu-btn small{font-size:clamp(10px,2.5vw,12px);color:var(--muted);line-height:1.35}
.home-footer{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex-shrink:0}
.prog{height:7px;background:#dae9e4;border-radius:50px;overflow:hidden;flex-shrink:0}.prog>div{background:var(--forest);height:100%;transition:width .2s}
.stepinfo{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted);flex-shrink:0}
.tag{display:inline-block;background:var(--mint);color:var(--forest-dark);padding:5px 10px;border-radius:999px;font-size:12px;font-weight:850}
.stage-title{font-size:clamp(19px,4.6vw,28px);font-weight:900;line-height:1.35;margin:0}.stage-sub{font-size:13px;color:var(--muted);margin:0;line-height:1.45}
.read-card{flex:1;min-height:0;display:flex;flex-direction:column;gap:9px;background:#f4f9f6;border:1px solid #d8eae1;border-radius:14px;padding:clamp(12px,3vw,22px)}
.read-card-title{font-size:13px;font-weight:900;color:var(--forest);flex:0 0 auto}
.read-text{min-height:0;flex:1;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;font-size:clamp(17px,4vw,21px);line-height:1.94;letter-spacing:.025em}
.pageno{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.question-text{font-size:clamp(17px,4.2vw,22px);font-weight:900;line-height:1.5;margin:0;flex:0 0 auto}
.answer-grid{display:grid;grid-template-columns:1fr;grid-template-rows:repeat(4,minmax(0,1fr));gap:8px;flex:1;min-height:0}
.answer-btn{display:flex;align-items:center;gap:11px;width:100%;min-height:0;border:1.6px solid #d7e6df;border-radius:12px;padding:8px 13px;background:#fff;text-align:left;color:var(--ink);font-size:clamp(13px,3.4vw,16px);line-height:1.4}
.answer-btn:hover,.answer-btn:focus-visible{background:var(--mint);border-color:var(--forest)}.answer-num{flex:0 0 28px;height:28px;display:grid;place-items:center;border-radius:8px;background:#eaf2ef;color:var(--forest-dark);font-weight:900;font-size:13px}
.minihint{font-size:12px;color:var(--muted);line-height:1.35}
.textarea{width:100%;min-height:0;flex:1;resize:none;border:2px solid var(--border);background:#fafcfb;border-radius:13px;padding:14px;color:var(--ink);font-size:16px;line-height:1.7}
.hint{background:var(--cream);border:1px solid #ebd6a4;border-radius:11px;padding:8px 11px;font-size:12px;line-height:1.4}
.correct-label{font-size:16px;font-weight:900;color:var(--forest)}.correct-label.miss{color:var(--error)}
.explanation-box{background:#f4f8f6;border:1px solid var(--border);padding:13px 15px;border-radius:14px;line-height:1.75;font-size:clamp(14px,3.4vw,17px)}
.versus{display:grid;grid-template-columns:1fr auto 1fr;gap:7px;align-items:stretch}.versus .half{background:#f7f9f7;border:1px solid #dfe9e4;border-radius:11px;padding:9px 10px;min-width:0;overflow-wrap:anywhere}.versus .half small{display:block;font-size:11px;color:var(--muted)}.versus .half b{font-size:13px;line-height:1.45}.versus .sep{align-self:center;color:var(--forest);font-size:18px;font-weight:900}
.model{background:#f6faf7;border-left:4px solid var(--forest);border-radius:11px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:clamp(14px,3.4vw,17px);line-height:1.7}
.mini-label{font-size:12px;color:var(--muted);font-weight:900}
.criteria{display:grid;grid-template-rows:repeat(3,1fr);gap:7px;flex:1;min-height:0}
.criterion{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:12px;padding:9px 12px;font-size:clamp(13px,3.1vw,15px);line-height:1.3;min-height:0}
.criterion input{width:19px;height:19px;accent-color:var(--forest);flex:0 0 auto}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tally>div{background:#f5faf7;border-radius:12px;padding:11px 5px;text-align:center}.tally strong{font-size:clamp(21px,5vw,30px);line-height:1.25;display:block}.tally small{font-size:11px;color:var(--muted)}
.result-number{font-size:clamp(46px,12vw,68px);font-weight:900;color:var(--forest);line-height:1.1;text-align:center}
.result-text{text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.banner{background:var(--cream);border:1px solid #efd9a9;border-radius:13px;padding:10px 13px;font-size:13px;line-height:1.55}
.skillbars{display:grid;grid-template-rows:repeat(5,minmax(0,1fr));gap:8px;flex:1;min-height:0}.skillbar{display:grid;grid-template-columns:75px 1fr 45px;gap:9px;align-items:center;font-size:12px}.skillbar b{font-size:13px}.bar{height:9px;border-radius:40px;background:#e2ece7;overflow:hidden}.bar>div{background:var(--forest);height:100%}
.guide-num{font-size:13px;color:var(--forest);font-weight:850}.guide-text{font-size:clamp(18px,4.1vw,23px);font-weight:800;line-height:1.7}.contrast-pair{width:100%;display:grid;gap:15px}.sample-banner{display:block}.guide-example{font-size:clamp(14px,3.4vw,18px);line-height:1.8;background:#f5f9f5;border-radius:12px;padding:15px}
.manage-btns{display:grid;grid-template-columns:1fr;gap:10px;flex:1;align-content:center}.manage-btns .btn{white-space:normal}
.nosize{display:none}.count{font-size:12px;font-weight:850;color:var(--muted);text-align:right}

@media(max-height:565px){.topbar{height:30px}.topstats span{padding:3px 6px}.brand{font-size:17px}.brand-mark{height:27px;width:27px}.shell{padding-top:4px;gap:4px}.screenhead{min-height:24px}.panel{padding:9px}.panel-inner{gap:6px}.home-intro p{display:none}.levelbtn small{display:none}.levelbtn{padding:6px 2px}.groupname{margin-bottom:4px;font-size:12px}.btn{min-height:36px;font-size:12px}.menu-btn small{display:none}.menu-btn{padding:5px 9px}.menu-btn b{font-size:13px}.read-text{font-size:16px;line-height:1.65}.read-card{padding:9px}.question-text{font-size:16px}.answer-btn{font-size:13px}.stage-title{font-size:18px}.stage-sub{font-size:11px}.explanation-box{font-size:13px;line-height:1.48}.criterion{padding:5px 7px}.result-text{font-size:12px}}
@media(max-width:350px){.topstats{font-size:10px}.topstats span{padding:4px 5px}.brand{font-size:17px}.panel{padding:11px}.menu-btn b{font-size:13px}.home-intro h1{font-size:20px}.btn{padding:6px 10px}.read-text{font-size:16px}.stage-title{font-size:18px}.tag{padding:4px 8px}.mini-label{font-size:11px}}

@media(max-width:350px) and (max-height:505px){.answer-btn{font-size:12px;padding:3px 7px;gap:7px;line-height:1.25}.answer-num{height:23px;flex-basis:23px;font-size:11px}.sample-banner{display:none}}
@media(orientation:landscape) and (max-height:450px){
 .shell{padding-top:4px;gap:3px}.topbar{height:26px}.brand-mark{height:25px;width:25px;font-size:14px}.brand{font-size:16px}.screen{gap:3px}.screenhead{min-height:22px}.screenhead h1{font-size:15px}.meta{font-size:10px}.panel{padding:7px 13px}.panel-inner{gap:4px}.panel-bottom{margin-top:4px}.btn{min-height:32px}.tag{font-size:10px;padding:3px 7px}.stage-title{font-size:16px}.stage-sub{font-size:11px}.read-card{padding:8px}.read-text{font-size:15px;line-height:1.45}.read-card-title{font-size:11px}.answer-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:5px}.answer-btn{font-size:12px;line-height:1.2;padding:3px 7px;gap:7px}.answer-num{height:23px;flex-basis:23px;font-size:11px}.question-text{font-size:15px;line-height:1.25}.mini-label{font-size:10px}.explanation-box{font-size:12px;line-height:1.4;padding:7px 9px}.sample-banner{display:none}.contrast-note{display:none}.contrast-pair{grid-template-columns:1fr 1fr;gap:9px}.contrast-pair .half{padding:10px!important}.contrast-pair .guide-text{font-size:14px;line-height:1.4}.model{font-size:14px;line-height:1.45;padding:9px}.tally>div{padding:4px}.tally strong{font-size:19px}.banner{padding:5px 8px;font-size:11px}.result-number{font-size:39px}.result-text{font-size:11px}.criteria{gap:4px}.criterion{padding:5px 8px;font-size:12px}.textarea{font-size:13px;line-height:1.25;padding:5px 7px}.home-intro h1{font-size:17px}.home-intro .eyebrow{display:none}.home-menu{gap:5px}.guide-example{padding:6px;font-size:13px;line-height:1.4}.guide-text{font-size:15px;line-height:1.4}.home-footer{gap:5px}
}

@media(max-height:460px) and (orientation:portrait){
 .shell{padding-top:2px;padding-bottom:3px;gap:2px}.topbar{height:26px}.screen{gap:2px}.screenhead{min-height:19px}.screenhead h1{font-size:14px}.meta,.stepinfo{font-size:10px}.panel{padding:6px 8px}.panel-inner{gap:3px}.panel-bottom{margin-top:3px}.btn{min-height:29px;padding:5px 7px;font-size:11px}.tag{font-size:10px;padding:2px 6px}.stage-title{font-size:15px}.question-text{font-size:15px;line-height:1.22}.read-card{padding:6px}.read-text{font-size:14px;line-height:1.42}.answer-btn{font-size:12px;line-height:1.13;padding:3px 5px}.answer-num{height:21px;flex-basis:21px}.explanation-box{font-size:12px;line-height:1.35;padding:6px 7px}.review-short-note,.contrast-note{display:none}.contrast-pair{grid-template-columns:1fr 1fr;gap:6px}.contrast-pair .half{padding:7px!important}.contrast-pair .guide-text{font-size:12px;line-height:1.28}.sample-banner{display:none}.textarea{min-height:30px;font-size:13px;line-height:1.25;padding:5px}.model{font-size:13px;line-height:1.35;padding:7px}.home-intro h1{font-size:17px}.home-intro .eyebrow{display:none}.home-menu{gap:4px}.menu-btn{padding:4px 6px}.result-number{font-size:35px}.tally>div{padding:4px 2px}.tally strong{font-size:17px}
}

</style>

<div class="shell">
<header class="topbar"><button class="brand" data-action="home" aria-label="読解ラボ ホームへ"><span class="brand-mark">文</span>読解ラボ</button><div class="topstats"><span id="headXp">0 XP</span><span id="headStreak">0日連続</span></div></header>
<div id="app" role="main"></div>
</div>
<input type="file" id="importFile" accept="application/json,.json" class="nosize">

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function streak(){let ds=new Set(data.days);let d=new Date();if(!ds.has(today()))d.setDate(d.getDate()-1);let n=0;for(let k=0;k<1000;k++){let t=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;if(!ds.has(t))break;n++;d.setDate(d.getDate()-1)}return n}
function accuracy(level,kind){const arr=data.results.filter(x=>x.level===level&&(!kind||x.kind===kind));return {seen:arr.length,pct:arr.length?Math.round(100*arr.filter(x=>x.correct).length/arr.length):0}}
function seenCount(level){return new Set(data.results.filter(x=>x.level===level).map(x=>x.id)).size}
function wrongCount(level){return data.wrongIds.filter(id=>BANK.some(q=>q.id===id&&q.level===level)).length}

function head(title,sub=''){return `<div class="screenhead"><div><h1>${esc(title)}</h1>${sub?`<div class="meta">${esc(sub)}</div>`:''}</div><button class="linkbtn" data-action="home">ホームへ</button></div>`}
function actionButton(text,action,cls='primary full',more=''){return `<button class="btn ${cls}" data-action="${action}" ${more}>${text}</button>`}
function home(){const l=LEVELS[state.level];return `<main class="screen"><div class="home-intro"><span class="eyebrow">READING LAB</span><h1>文章を読み解く力を育てよう。</h1><p>対比・反対語・論理・根拠・記述を、1問ずつ着実に。</p></div><div><div class="groupname">1. 学年を選ぶ　<span class="meta">全144問・各学年48問</span></div><div class="levelgrid">${Object.entries(LEVELS).map(([id,x])=>`<button class="levelbtn" data-action="level" data-level="${id}" aria-pressed="${state.level===id}">${esc(x.short)}<small>${esc(x.tag)}</small></button>`).join('')}</div></div><button class="btn gold full" data-action="start" data-mode="mixed">総合トレーニング（10問）</button><div class="groupname" style="margin-bottom:0">2. 分野を選ぶ　<span class="meta">${seenCount(state.level)}/48問 学習済み</span></div><div class="home-menu">${ORDER.map(k=>`<button class="menu-btn" data-action="start" data-mode="${k}"><b>${SKILLS[k].label}</b><small>${SKILLS[k].desc}</small></button>`).join('')}<button class="menu-btn" data-action="start" data-mode="review"><b>苦手を復習</b><small>${wrongCount(state.level)}問の復習候補</small></button></div><div class="home-footer"><button class="btn outline full" data-action="progress">学習記録</button><button class="btn outline full" data-action="guide">読解のコツ</button></div></main>`}
function makeQueue(mode){let bank=BANK.filter(x=>x.level===state.level);if(mode==='review'){let wrong=new Set(data.wrongIds);return shuffle(bank.filter(x=>wrong.has(x.id))).slice(0,10)}if(mode!=='mixed')return shuffle(bank.filter(x=>x.kind===mode)).slice(0,mode==='antonym'?10:8);
let picks=[],parents=new Set();for(let k of ORDER){let options=shuffle(bank.filter(x=>x.kind===k)),n=0;for(let q of options){if(n===2)break;if(parents.has(q.parent))continue;picks.push(q);n++;parents.add(q.parent)}if(n<2){for(let q of options){if(n===2)break;if(!picks.some(v=>v.id===q.id)){picks.push(q);n++}}}}
return shuffle(picks)}
function start(mode){let queue=makeQueue(mode);if(!queue.length){alert('この学年には復習する問題がまだありません。別の分野に挑戦してみよう。');return}state={...state,screen:'quiz',mode,queue,idx:0,stage:'read',answers:[],order:{},choice:null,typed:'',hint:false,checks:[false,false,false],markCount:0,readPages:[],readPage:0,readFrom:'answer'};for(let q of queue){if(q.choices)state.order[q.id]=shuffle(q.choices)}render()}
function resetQuestion(){state.stage='read';state.readPage=0;state.readPages=[];state.readFrom='answer';state.choice=null;state.typed='';state.hint=false;state.checks=[false,false,false];state.markCount=0}
function quizShell(inner){let q=current();let p=(state.idx+((state.stage==='review'||state.stage==='contrast-review')?1:0))/state.queue.length*100;let title=state.mode==='mixed'?'総合トレーニング':state.mode==='review'?'苦手を復習':SKILLS[state.mode].label+'トレーニング';return `<main class="screen">${head(title,`${LEVELS[state.level].label} ／ ${state.idx+1} / ${state.queue.length}問`)}<div class="prog" aria-label="問題の進み具合"><div style="width:${p}%"></div></div><div class="stepinfo"><span>${esc(SKILLS[q.kind].label)}　・　${esc(q.title)}</span><span>獲得 ${state.answers.reduce((s,x)=>s+x.points,0)} XP</span></div><div class="panel">${inner}</div></main>`}
function readScreen(){let target=state.readFrom==='review'?'解説へ戻る':'問題へ進む';return quizShell(`<div class="panel-inner"><span class="tag">STEP 1　文章を読む</span><h2 class="stage-title">本文をじっくり読もう</h2><div class="read-card"><span class="read-card-title">本文</span><div class="read-text" id="readText"></div></div></div><div class="panel-bottom"><button class="btn outline" id="readPrev" data-action="read-prev" disabled>前へ</button><span class="pageno" id="readIndicator">1 / 1 ページ</span><button class="btn primary" data-action="read-next" id="readNext">${target}</button></div>`)}
function answerScreen(){let q=current();let writing=q.kind==='writing';let choices=state.order[q.id]||[];return quizShell(`<div class="panel-inner"><span class="tag">STEP 2　${writing?'記述で答える':'4択で答える'}</span><h2 class="question-text">${esc(q.question)}</h2><button class="linkbtn" data-action="read-again" style="align-self:flex-start;padding:0">本文をもう一度読む</button>${writing?`<textarea class="textarea" id="answerText" maxlength="500" placeholder="本文の根拠や対比を使って、自分の言葉で書いてみよう。">${esc(state.typed)}</textarea>${state.hint?`<div class="hint">${esc(q.hint)}</div>`:''}<div class="stepinfo"><span>目安40〜80字</span><span id="countText">${state.typed.length}字</span></div>`:`<div class="answer-grid">${choices.map((c,i)=>`<button class="answer-btn" data-action="choose" data-index="${i}"><span class="answer-num">${i+1}</span><span>${esc(c)}</span></button>`).join('')}</div><div class="mini-label">本文の言葉を手がかりに考えよう。</div>`}</div>${writing?`<div class="panel-bottom">${actionButton(state.hint?'ヒントを閉じる':'ヒントを見る','hint','outline flex')}${actionButton('模範解答と比べる','reveal','primary flex')}</div>`:''}`)}
function sampleScreen(){let q=current();return quizShell(`<div class="panel-inner"><span class="tag">STEP 3　答えを比べる</span><h2 class="stage-title">模範解答と比べよう</h2><div><div class="mini-label">模範解答例</div><div class="model">${esc(q.sample)}</div></div><div class="banner sample-banner">言い方が違っていても、本文の根拠と結論が合っていれば大丈夫です。</div></div><div class="panel-bottom">${actionButton('自分の解答を見る','own','outline flex')}${actionButton('採点する','selfmark','primary flex')}</div>`)}
function ownScreen(){return quizShell(`<div class="panel-inner"><span class="tag">自分の解答</span><h2 class="stage-title">書いた内容を振り返ろう</h2><div class="read-card"><span class="read-card-title">自分が書いた解答</span><div class="read-text" id="ownText"></div></div></div><div class="panel-bottom"><button class="btn outline" data-action="own-prev" id="ownPrev" disabled>前へ</button><span class="pageno" id="ownIndicator">1 / 1 ページ</span><button class="btn primary" data-action="own-next" id="ownNext">模範解答へ</button></div>`)}
function markScreen(){let q=current();return quizShell(`<div class="panel-inner"><span class="tag">STEP 4　自己採点</span><h2 class="stage-title">3つのポイントを確認</h2><p class="stage-sub">できたところにチェックを入れよう。</p><div class="criteria">${q.criteria.map((x,i)=>`<label class="criterion"><input type="checkbox" data-check="${i}" ${state.checks[i]?'checked':''}><span>${esc(x)}</span></label>`).join('')}</div><div class="mini-label">確認した項目：<span id="criteriaCount">${state.checks.filter(Boolean).length}</span> / 3</div></div><div class="panel-bottom">${actionButton('模範解答へ戻る','sample','outline flex')}${actionButton('採点を確定する','mark','primary flex')}</div>`)}
function feedbackScreen(){let q=current(),v=state.choice,good=state.answers[state.answers.length-1]?.correct;let pts=state.answers[state.answers.length-1]?.points||0;let result=q.kind==='writing'?`3観点中 ${state.markCount} 個を確認　（+${pts} XP）`:`正解：${esc(q.correct)}`;
return quizShell(`<div class="panel-inner"><span class="tag">STEP ${q.kind==='writing'?'5':'3'}　解説を読む</span><h2 class="stage-title correct-label ${good?'':'miss'}">${good?'よくできました！':'ここを復習しよう'}</h2><div class="explanation-box"><div style="font-weight:900;margin-bottom:5px">${result}</div>${esc(q.explanation)}</div><div class="flexgrow"></div><p class="stage-sub review-short-note">${q.kind==='antonym'?'対になる言葉を確かめて次へ進もう。':'次は本文の対比を整理してみよう。'}</p></div><div class="panel-bottom">${actionButton('本文を確認','review-read','outline flex')}${actionButton(q.kind==='antonym'?(state.idx===state.queue.length-1?'学習結果を見る':'次の問題へ'):'対比を整理する','review-contrast-next','primary flex')}</div>`)}
function contrastScreen(){let q=current();return quizShell(`<div class="panel-inner"><span class="tag">STEP ${q.kind==='writing'?'6':'4'}　対比を整理する</span><h2 class="stage-title">AとBの違いを確認</h2><div class="flexgrow center" style="display:flex"><div class="contrast-pair"><div class="half" style="background:#edf7f1;border:1px solid #cce6d8;padding:15px;border-radius:14px"><span class="mini-label">Aの視点</span><div class="guide-text">${esc(q.a)}</div></div><div class="half" style="background:#fff7ea;border:1px solid #eedcb7;padding:15px;border-radius:14px"><span class="mini-label">Bの視点</span><div class="guide-text">${esc(q.b)}</div></div></div></div><p class="stage-sub contrast-note">対比の「軸」を意識して読むと、記述問題でも根拠を整理しやすくなります。</p></div><div class="panel-bottom">${actionButton('解説に戻る','review-back','outline flex')}${actionButton(state.idx===state.queue.length-1?'学習結果を見る':'次の問題へ','next','primary flex')}</div>`)}
function addResult(q,correct,points){data.results.push({id:q.id,kind:q.kind,level:q.level,correct:!!correct,points,date:today()});data.results=data.results.slice(-6000);data.xp+=points;if(!data.days.includes(today()))data.days.push(today());data.days=data.days.slice(-730);data.wrongIds=correct?data.wrongIds.filter(id=>id!==q.id):[...new Set([...data.wrongIds,q.id])];state.answers.push({id:q.id,kind:q.kind,correct,points});save()}
function choose(idx){let q=current();if(state.stage!=='answer'||q.kind==='writing')return;let c=state.order[q.id][idx];if(c===undefined)return;state.choice=c;addResult(q,c===q.correct,c===q.correct?10:0);state.stage='review';render()}
function next(){if(state.idx===state.queue.length-1){data.sessions++;save();state.screen='result'}else{state.idx++;resetQuestion()}render()}
function resultScreen(){let total=state.answers.length,good=state.answers.filter(x=>x.correct).length,points=state.answers.reduce((s,x)=>s+x.points,0),pct=total?Math.round(good*100/total):0,weak=ORDER.filter(k=>state.answers.some(x=>x.kind===k&&!x.correct));return `<main class="screen">${head('今回の学習結果')}<section class="panel"><div class="panel-inner center"><span class="tag">学習おつかれさま！</span><div class="result-number">${pct}%</div><div class="result-text">${pct>=80?'根拠をよく読み取れています。':pct>=50?'着実に身についています。':'苦手に気づけたことが第一歩です。'}</div><div class="tally" style="width:100%"><div><strong>${good}/${total}</strong><small>できた問題</small></div><div><strong>${points}</strong><small>今回のXP</small></div><div><strong>${data.xp}</strong><small>累計XP</small></div></div>${weak.length?`<div class="banner" style="width:100%">次は「${weak.map(k=>SKILLS[k].label).join('・')}」を復習しよう。</div>`:`<div class="banner" style="width:100%">次は別の学年や分野にも挑戦してみよう。</div>`}</div><div class="panel-bottom">${actionButton('ホームへ','home','outline flex')}${actionButton('もう10問挑戦','again','primary flex')}</div></section></main>`}
function progressScreen(){let lv=state.level,a=accuracy(lv),seen=seenCount(lv),wrong=wrongCount(lv);return `<main class="screen">${head('学習記録',LEVELS[lv].label)}<section class="panel"><div class="panel-inner"><div class="tally"><div><strong>${seen}/48</strong><small>学習した問題</small></div><div><strong>${a.seen?a.pct+'%':'—'}</strong><small>正答率</small></div><div><strong>${wrong}</strong><small>復習候補</small></div></div><div class="groupname" style="margin:0">分野別の正答率</div><div class="skillbars">${ORDER.map(k=>{let x=accuracy(lv,k);return `<div class="skillbar"><b>${SKILLS[k].label}</b><div class="bar"><div style="width:${x.pct}%"></div></div><span style="text-align:right">${x.seen?x.pct+'%':'未'} </span></div>`}).join('')}</div><div class="mini-label">累計 ${data.xp} XP ／ 学習終了 ${data.sessions}回 ／ ${streak()}日連続</div></div><div class="panel-bottom">${actionButton('記録の管理','manage','outline flex')}${actionButton('苦手を復習','review-start','primary flex')}</div></section></main>`}
function manageScreen(){return `<main class="screen">${head('学習記録の管理')}<section class="panel"><div class="panel-inner"><h2 class="stage-title">記録の保存・読み込み</h2><p class="stage-sub">学習記録は端末内に保存されます。他の端末に移すにはJSONファイルで保存・読み込みしてください。自由記述の解答文は保存しません。</p><div class="manage-btns">${actionButton('記録を書き出す（JSON）','export','outline full')}${actionButton('記録を読み込む','import','outline full')}${actionButton('学習記録を削除する','reset','outline full')}</div></div><div class="panel-bottom">${actionButton('学習記録に戻る','progress','primary full')}</div></section></main>`}
const TIPS=[['対比の「軸」を探す','「Aはこうだ。一方、Bはこうだ」とあれば、何について比べているかを一言でまとめよう。','紙の本は想像しやすい。一方、動画は動きが伝わる。→「伝わり方」の違い'],['接続語を「関係」に置きかえる','「しかし」は予想に反する、「一方で」は違いを比べる、「だから」は理由から結果を導く。','雨が降った。しかし試合は行われた。→ 中止の予想に反して行われた'],['筆者の主張と根拠を分ける','筆者が伝えたいことと、それを支える理由は別。理由は本文から探そう。','主張：点数だけでは判断できない。理由：平均が同じでもばらつきが違う。'],['反対語は文脈で考える','一つの言葉だけを暗記せず、前後の文脈の中でどんな意味が対照になるかを考えよう。','具体 ↔ 抽象 ／ 楽観 ↔ 悲観'],['記述は「対比→根拠→結論」','本文の情報だけを使い、何が違うか・なぜそう言えるかを短くつなげよう。','Aは〜だが、Bは〜である。そのため、〜と考えられる。']];
function guideScreen(){let t=TIPS[state.guidePage];return `<main class="screen">${head('読解のコツ',`${state.guidePage+1} / ${TIPS.length}`)}<section class="panel"><div class="panel-inner"><div class="guide-num">コツ ${state.guidePage+1}</div><h2 class="stage-title">${esc(t[0])}</h2><div class="flexgrow center" style="display:flex"><div class="guide-text">${esc(t[1])}</div></div><div class="mini-label">たとえば</div><div class="guide-example">${esc(t[2])}</div></div><div class="panel-bottom"><button class="btn outline flex" data-action="guide-prev" ${state.guidePage===0?'disabled':''}>前のコツ</button><button class="btn primary flex" data-action="guide-next">${state.guidePage===TIPS.length-1?'練習を始める':'次のコツ'}</button></div></section></main>`}
function render(){document.getElementById('headXp').textContent=`${data.xp} XP`;document.getElementById('headStreak').textContent=`${streak()}日連続`;let html=state.screen==='home'?home():state.screen==='progress'?progressScreen():state.screen==='manage'?manageScreen():state.screen==='guide'?guideScreen():state.screen==='result'?resultScreen():state.stage==='read'?readScreen():state.stage==='answer'?answerScreen():state.stage==='sample'?sampleScreen():state.stage==='own'?ownScreen():state.stage==='selfmark'?markScreen():state.stage==='contrast-review'?contrastScreen():feedbackScreen();app.innerHTML=html;if(state.screen==='quiz'&&(state.stage==='read'||state.stage==='own'))requestAnimationFrame(()=>paginateVisible());}
// Display all text through explicit pages, never a scroll container.
function calcPages(text,el){let pages=[],i=0,all=String(text),capacity=0;if(!el)return [all];let width=el.clientWidth,height=el.clientHeight;if(width<10||height<15)return [all];while(i<all.length&&pages.length<100){let left=all.slice(i),lo=1,hi=left.length,best=1;while(lo<=hi){let mid=(lo+hi)>>1;el.textContent=left.slice(0,mid);if(el.scrollHeight<=el.clientHeight+2){best=mid;lo=mid+1}else hi=mid-1;}let used=best;if(used<left.length&&used>=20){let chunk=left.slice(0,used),dot=Math.max(chunk.lastIndexOf('。')+1,chunk.lastIndexOf('！')+1,chunk.lastIndexOf('？')+1);if(dot>used*.69)used=dot;}pages.push(left.slice(0,Math.max(1,used)));i+=Math.max(1,used);}return pages.length?pages:['']}
function paginateVisible(){if(state.screen!=='quiz')return;let isOwn=state.stage==='own',id=isOwn?'ownText':'readText',el=document.getElementById(id);if(!el)return;const source=isOwn?state.typed:current().passage;state.readPages=calcPages(source,el);state.readPage=Math.min(state.readPage,state.readPages.length-1);el.textContent=state.readPages[state.readPage];syncPager(isOwn);}
function syncPager(own){let id=own?'own':'read';let el=document.getElementById(id+'Text');if(el)el.textContent=state.readPages[state.readPage]||'';let counter=document.getElementById(id+'Indicator'),prev=document.getElementById(id+'Prev'),nextBtn=document.getElementById(id+'Next');if(counter)counter.textContent=`${state.readPage+1} / ${state.readPages.length} ページ`;if(prev)prev.disabled=state.readPage===0;if(nextBtn)nextBtn.textContent=state.readPage<state.readPages.length-1?'次のページ':own?'模範解答へ':state.readFrom==='review'?'解説へ戻る':'問題へ進む'}
function readNext(){if(state.readPage<state.readPages.length-1){state.readPage++;syncPager(false)}else{state.stage=state.readFrom==='review'?'review':'answer';render()}}
function ownNext(){if(state.readPage<state.readPages.length-1){state.readPage++;syncPager(true)}else{state.stage='sample';render()}}
function reveal(){let el=document.getElementById('answerText');let txt=el?el.value.trim():state.typed.trim();if(txt.length<10){alert('まずは10文字以上で、自分の考えを書いてみよう。');el?.focus();return;}state.typed=txt;state.stage='sample';render()}
function mark(){let count=state.checks.filter(Boolean).length;state.markCount=count;let q=current(),correct=count>=2,points=count*5;addResult(q,correct,points);state.stage='review';render()}
function exportData(){let text=JSON.stringify({type:'dokkai-lab',version:1,exportedAt:new Date().toISOString(),data},null,2);let b=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='dokkai-learning-record.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function readAgain(from){state.readFrom=from;state.stage='read';state.readPage=0;render()}
app.addEventListener('input',e=>{if(e.target.id==='answerText'){state.typed=e.target.value;let n=document.getElementById('countText');if(n)n.textContent=state.typed.length+'字'}});
app.addEventListener('change',e=>{if(e.target.matches('[data-check]')){state.checks[+e.target.dataset.check]=e.target.checked;let n=document.getElementById('criteriaCount');if(n)n.textContent=state.checks.filter(Boolean).length}});
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;switch(a){
case'home':state.screen='home';render();break;
case'level':state.level=b.dataset.level;render();break;
case'start':start(b.dataset.mode);break;
case'again':start('mixed');break;
case'progress':state.screen='progress';render();break;
case'manage':state.screen='manage';render();break;
case'guide':state.screen='guide';state.guidePage=0;render();break;
case'guide-prev':state.guidePage=Math.max(0,state.guidePage-1);render();break;
case'guide-next':if(state.guidePage===TIPS.length-1)start('mixed');else{state.guidePage++;render()}break;
case'read-prev':state.readPage=Math.max(0,state.readPage-1);syncPager(false);break;
case'read-next':readNext();break;
case'own-prev':state.readPage=Math.max(0,state.readPage-1);syncPager(true);break;
case'own-next':ownNext();break;
case'read-again':readAgain('answer');break;
case'review-read':readAgain('review');break;
case'review-contrast-next':if(current().kind==='antonym')next();else{state.stage='contrast-review';render()}break;
case'review-back':state.stage='review';render();break;
case'choose':choose(Number(b.dataset.index));break;
case'hint':state.typed=document.getElementById('answerText')?.value||state.typed;state.hint=!state.hint;render();document.getElementById('answerText')?.focus();break;
case'reveal':reveal();break;
case'sample':state.stage='sample';render();break;
case'own':state.stage='own';state.readPage=0;render();break;
case'selfmark':state.stage='selfmark';render();break;
case'mark':mark();break;
case'next':next();break;
case'export':exportData();break;
case'import':document.getElementById('importFile').click();break;
case'review-start':start('review');break;
case'reset':if(confirm('これまでの学習記録をすべて削除します。よろしいですか？')){data=blank();save();render()}break;
}});
document.getElementById('importFile').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{if(f.size>2000000)throw Error('ファイルが大きすぎます');let obj=JSON.parse(await f.text()),x=obj.type==='dokkai-lab'?obj.data:obj;if(!x||!Array.isArray(x.results)||!Array.isArray(x.days)||!Array.isArray(x.wrongIds)||!Number.isFinite(x.xp))throw Error('学習記録ではありません');if(!confirm('現在の記録を読み込んだ内容で置き換えます。よろしいですか？'))return;data={xp:Math.max(0,x.xp),days:x.days.filter(t=>typeof t==='string').slice(-730),wrongIds:x.wrongIds.filter(t=>typeof t==='string'),results:x.results.filter(r=>r&&typeof r.id==='string'&&ORDER.includes(r.kind)).slice(-6000),sessions:Number(x.sessions)||0};save();render();alert('学習記録を読み込みました。')}catch(err){alert('読み込めませんでした：'+err.message)}finally{e.target.value=''}});
document.addEventListener('keydown',e=>{if(state.screen!=='quiz'||state.stage!=='answer'||current()?.kind==='writing'||e.target.matches('input,textarea'))return;if(['1','2','3','4'].includes(e.key))choose(Number(e.key)-1)});
window.addEventListener('resize',()=>{if(state.screen==='quiz'&&(state.stage==='read'||state.stage==='own')){requestAnimationFrame(()=>paginateVisible())}});
render();
</script>
</body>
</html>
